services:
  postgres-ms:
    container_name: postgres-ms
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mDIDkafaVvuPapcbOhxwaxNyskfqQjrA
      POSTGRES_DB: railway
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: redis
    image: redis:latest
    command: redis-server --requirepass WjDbipeOzwRxhQbUWMaAJIuvrZQLhgkv
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "-a", "WjDbipeOzwRxhQbUWMaAJIuvrZQLhgkv", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  servicereg:
    container_name: servicereg
    image: sujaysharvesh/servicereg:latest
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    depends_on:
      - redis
      - postgres-ms

  gateway-ms:
    container_name: gateway-ms
    image: sujaysharvesh/gateway-ms:latest
    ports:
      - "8085:8085"
    networks:
      - microservices-network
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "gateway,health,info"
    depends_on:
      - servicereg

  user:
    container_name: user
    image: sujaysharvesh/userservice:latest
    networks:
      - microservices-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ms:5432/railway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mDIDkafaVvuPapcbOhxwaxNyskfqQjrA
      SPRING_DATA_REDIS_URL: redis://default:WjDbipeOzwRxhQbUWMaAJIuvrZQLhgkv@redis:6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: WjDbipeOzwRxhQbUWMaAJIuvrZQLhgkv
    command: ["java", "-jar", "/app.jar"]
    depends_on:
      - gateway-ms
      - servicereg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  music:
    container_name: music
    image: sujaysharvesh/musicservice:latest
    networks:
      - microservices-network
    environment:
      SPRING_CLOUD_DISCOVERY_CLIENT_HEALTHINDICATOR_ENABLED: "true"
      SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED: "true"
      SPRING_CLOUD_LOADBALANCER_RETRY_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ms:5432/railway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mDIDkafaVvuPapcbOhxwaxNyskfqQjrA
      JAVA_OPTS: "-Dspring.servlet.multipart.location=/tmp -Djava.security.egd=file:/dev/./urandom"
      SPRING_APPLICATION_NAME: music-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://servicereg:8761/eureka/
      SPRING_PROFILES_ACTIVE: docker
      UPLOAD_DIR: "/tmp/uploads"
    depends_on:
      - gateway-ms
      - servicereg
    volumes:
      - ./music-uploads:/tmp/uploads


networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data:
